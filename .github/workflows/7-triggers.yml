name: Triggers
on: 
  push:
    branches:
      - main
      - aprendiendo-github-actions
  pull_request:
    branches:
      - aprendiendo-github-actions
  schedule:
    - cron: '38 4 * * *'  

jobs:
  test_schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Triggers cron
        if: github.event.schedule != '30 5 * * 1,3'
        run: echo "This step will be skipped on Monday and Wednesday"
      - name: Every time
        run: echo "This step will always run"
